# OrchestratoRRR — example TOML configuration.
#
# Copy this file to `orchestrator.local.toml` and adjust paths for your machine.
# `orchestrator.local.toml` is git-ignored.

[orchestrator]
log_dir = "logs"
report_dir = "run-results"
heartbeat_interval_seconds = 10
poll_interval_seconds = 1

[mumu]
lifecycle_mode = "managed"
executable = "C:\\path\\to\\MuMuNxDevice.exe"
adb_executable = "C:\\path\\to\\adb.exe"
adb_serial = "127.0.0.1:<PORT>"
start_timeout_seconds = 120
stop_timeout_seconds = 20
start_arguments = []
stop_arguments = []

[starrail]
executable = "C:\\path\\to\\StarRailCopilot\\toolkit\\python.exe"
working_directory = "C:\\path\\to\\StarRailCopilot"
arguments = ["gui.py", "--run", "src", "--port", "22367"]
log_path_template = 'log/{date}_src.txt'
success_keywords = [
    "No task pending",
    "for task `Restart`",
]
failure_keywords = [
    "ScriptError:",
    "Request human takeover",
    "Retry screenshot() failed",
    "NemuIpcError",
]
task_timeout_seconds = 3600
stop_timeout_seconds = 10

[starrail.environment]
PYTHONIOENCODING = "utf-8"

[maa]
executable = "C:\\path\\to\\MAA\\MAA.exe"
working_directory = "C:\\path\\to\\MAA"
arguments = []
timeout_seconds = 1800
stop_timeout_seconds = 10

[maa.environment]
PYTHONIOENCODING = "utf-8"

[maa_sync]
enabled = false
gui_settings_source = ""
gui_tasks_source = ""
cli_profile_destination = ""
cli_tasks_destination = ""
backup_enabled = true
max_source_bytes = 4194304
requires_administrator = false

# [maa_update] 默认关闭（模捷保守值），但 `run` 入口已解闸：置 enabled = true 且
# allow_network = true 即可真正执行 UPDATE_MAA 阶段。
#
# 上游行为（核对 maa-cli 基线 de9c4d9）：安装环节非事务性。maa_core.rs 的
# pre_install_hook 先调用 ensure_clean() 将 lib/ 与 resource/ 整体 remove_dir_all
# 后重建空目录，再直接往正式目录逐文件解压；无暂存目录、无完成标记、无回滚。
# 因此解压中途被中断时，旧安装已被删除，尚未解压到的条目直接缺失
# （而不是回退到旧版）。
#
# 中断在实践中可自愈，靠两道兜底：
#   1. 官方 Windows 发布包将 MaaCore.dll 排在所有 resource/ 条目之后（核对
#      v6.9.5–v6.14.2 共 11 个包均如此；v6.14.2 中 resource/ 位于 508-9350，
#      MaaCore.dll 位于 9362）。中断时动态库大概率尚未落盘，find_library()
#      找不到它，core_version() 返回 Err，下一次 maa update 会重新安装。
#   2. MAA GUI 覆盖安装可人工修复。
#   注：第 1 道建立在发布包的打包顺序上，而非安装器的显式保证；打包顺序
#   变动或非 Windows 平台可能不适用。
#
# timeout_seconds 取 3600 而非 1800：官方整包约 254 MiB、共 9367 个归档条目
# （其中 8843 个在 resource/ 下），较大的预算可降低被强行终止的概率。
#
# 仍生效的约束：MAAUpdateConfig 禁止 self/hot-update/install/run/task 子命令，
# 要求 arguments[0] == "update"，且 enabled 时必须 allow_network = true。
[maa_update]
enabled = false
allow_network = false
requires_administrator = false
arguments = ["update"]
timeout_seconds = 3600

# [maa_resource_merge] 默认关闭。启用后在 UPDATE_MAA 之后把 MaaResource 增量资源
# 覆盖合并进随 MaaCore 安装的共用 resource 目录。
#
# 为何需要：`maa update` 只把 MaaResource 仓库 git pull 到 <data>/MaaResource，不会
# 并入 <data>/resource。maa-cli 随后让 MaaCore 按 resource -> MaaResource/resource
# -> cache/resource 顺序对同一单例连续调用 AsstLoadResource，而
# InfrastConfig::parse 用 m_skills.emplace(facility, ...) 装填技能表（emplace 对已
# 存在的 key 静默不覆盖），随后解析 skillsGroup 时却用 .at() 查找技能 id。因此
# 当新版资源引入「新 skillsGroup 引用新技能」时，第二遍加载会命中第一遍留下的
# 旧技能表，.at() 抛 std::out_of_range，整个资源加载失败，maa-cli 以退出码 1 结束。
# MAA GUI 不受影响，因为它更新资源时是把增量包 DirectoryMerge 就地并入自己的
# resource，全程只有一份 infrast.json。本阶段做的就是 GUI 那个合并动作。
#
# 安全余量：逐文件“同目录临时文件 + fsync + os.replace”提交；内容相同则跳过，
# 不产生写入；只覆盖源侧存在的路径，不删除目标独有文件（core 自带的 onnx/OCR
# 等不会丢）；跳过符号链接；源与目标互为祖先时在校验期拒绝。
#
# 注意：destination_directory 与 MAA GUI 共用。合并会让 GUI 也看到新资源（通常
# 是期望行为）；若不希望影响 GUI，请保持 enabled = false。
[maa_resource_merge]
enabled = false
# source_directory = "C:\\path\\to\\MAA\\MaaResource\\resource"
# destination_directory = "C:\\path\\to\\MAA\\resource"
max_files = 20000
max_file_bytes = 67108864
timeout_seconds = 600

[aalc]
executable = "C:\\path\\to\\AALC.exe"
working_directory = "C:\\path\\to\\AALC"
arguments = []
attempts = 3
attempt_timeout_seconds = 7200
stop_timeout_seconds = 10
requires_administrator = false

[aalc.environment]
PYTHONIOENCODING = "utf-8"
